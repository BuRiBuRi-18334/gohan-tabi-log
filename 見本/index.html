<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ごはん旅ログ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 画面上部：タイトルと県のしぼりこみ -->
  <header class="app-header">
    <h1>🍙 ごはん旅ログ</h1>
    <select id="filter-pref" aria-label="都道府県でしぼりこむ">
      <option value="">すべての県</option>
    </select>
  </header>

  <!-- 記録の一覧 -->
  <main>
    <p id="summary" class="summary"></p>
    <ul id="list" class="grid"></ul>
    <div id="empty" class="empty" hidden>
      <p>まだ記録がありません。<br>右下の「＋」から最初のごはんを記録しましょう！</p>
    </div>
  </main>

  <!-- 右下の追加ボタン -->
  <button id="add-btn" class="fab" type="button" aria-label="記録を追加">＋</button>

  <!-- 記録の追加・編集フォーム -->
  <dialog id="form-dialog">
    <form id="record-form">
      <h2 id="form-title">ごはんを記録</h2>

      <label class="photo-picker">
        <img id="photo-preview" alt="" hidden>
        <span id="photo-placeholder">📷 写真をえらぶ</span>
        <input type="file" id="photo-input" accept="image/*" class="visually-hidden">
      </label>

      <label>料理名
        <input type="text" id="name-input" placeholder="例：味噌ラーメン" required>
      </label>

      <div class="row">
        <label>都道府県
          <select id="pref-input" required>
            <option value="">選択してください</option>
          </select>
        </label>
        <label>市町村
          <input type="text" id="city-input" placeholder="例：札幌市">
        </label>
      </div>

      <label>食べた日
        <input type="date" id="date-input" required>
      </label>

      <label>メモ（なくてもOK）
        <textarea id="memo-input" rows="2" placeholder="お店の名前や感想など"></textarea>
      </label>

      <div class="actions">
        <button type="button" id="cancel-btn" class="secondary">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 記録の詳細表示 -->
  <dialog id="detail-dialog">
    <img id="detail-photo" alt="">
    <div class="detail-body">
      <h2 id="detail-name"></h2>
      <p id="detail-place" class="place"></p>
      <p id="detail-date" class="date"></p>
      <p id="detail-memo" class="memo"></p>
      <div class="actions">
        <button type="button" id="delete-btn" class="danger">削除</button>
        <button type="button" id="edit-btn" class="secondary">編集</button>
        <button type="button" id="close-btn" class="primary">閉じる</button>
      </div>
    </div>
  </dialog>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
