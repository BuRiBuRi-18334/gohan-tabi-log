<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ごはん旅ログ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>ごはん旅ログ</h1>
  <p>旅先で食べたごはんの記録</p>
  <p id="record-count"></p>
  <form id="record-form">
    <label>写真
      <input type="file" id="photo-input" accept="image/*">
    </label>
    <img id="photo-preview" alt="">

    <label>料理名
      <input type="text" id="name-input" placeholder="例：味噌ラーメン" required>
    </label>

    <label>都道府県
      <select id="pref-input" required>
        <option value="">選んでください</option>
      </select>
    </label>

    <label>市町村
      <select id="city-input">
        <option value="">選ばない</option>
      </select>
    </label>

    <label>食べた日
      <input type="date" id="date-input" required>
    </label>

    <label>メモ
      <textarea id="memo-input" rows="2" placeholder="お店の名前や感想など"></textarea>
    </label>

    <button type="submit">保存</button>
  </form>
  <ul id="list" class="grid"></ul>

  <script src="cities.js"></script>
    <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
