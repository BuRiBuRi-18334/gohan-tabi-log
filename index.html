<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ごはん旅ログ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="lib/leaflet.css">
          <link rel="stylesheet" href="lib/MarkerCluster.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>🍙 ごはん旅ログ</h1>
    <select id="filter-pref">
      <option value="">すべての県</option>
    </select>
  </header>
  <p>旅先で食べたごはんの記録</p>
  <p id="record-count"></p>
  <dialog id="form-dialog">
  <form id="record-form">
    <h2 id="form-title">ごはんを記録</h2>
    <label>写真
      <input type="file" id="photo-input" accept="image/*">
    </label>
    <img id="photo-preview" alt="">

    <label>料理名
      <input type="text" id="name-input" placeholder="例：味噌ラーメン" required>
    </label>

    <label>都道府県
      <select id="pref-input" required>
        <option value="">選んでください</option>
      </select>
    </label>

    <label>市町村
      <select id="city-input">
        <option value="">選ばない</option>
      </select>
    </label>

    <label>食べた日
      <input type="date" id="date-input" required>
    </label>

    <label>メモ
      <textarea id="memo-input" rows="2" placeholder="お店の名前や感想など"></textarea>
    </label>
        <label>順位（トップ3）
      <select id="rank-input">
        <option value="0">なし</option>
        <option value="1">🥇 1位</option>
        <option value="2">🥈 2位</option>
        <option value="3">🥉 3位</option>
      </select>
    </label>

        <div class="actions">
      <button type="button" id="cancel-btn" class="secondary">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
  </dialog>
    <nav class="tabs">
        <button type="button" id="tab-list" class="tab">一覧</button>
        <button type="button" id="tab-map" class="tab active">地図</button>
  </nav>
    <ul id="list" class="grid" hidden></ul>
      <div id="map"></div>
<button type="button" id="add-btn" class="fab">＋</button>
  <dialog id="detail-dialog">
    <img id="detail-photo" alt="">
    <div class="detail-body">
      <h2 id="detail-name"></h2>
      <p id="detail-place"></p>
      <p id="detail-date"></p>
      <p id="detail-memo"></p>
      <div class="actions">
        <button type="button" id="delete-btn" class="danger">削除</button>
        <button type="button" id="edit-btn" class="secondary">編集</button>
        <button type="button" id="close-btn">閉じる</button>
      </div>
    </div>
  </dialog>
      <script src="lib/leaflet.js"></script>
       <script src="lib/leaflet.markercluster.js"></script> 
  <script src="cities.js"></script>
    <script src="japan.js"></script>
    <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
